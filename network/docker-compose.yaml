      - couchdb-bofasg2x
    networks:
      fabric:
        aliases:
          - peer0.bofasg2x.example.com
    deploy:
      mode: replicated
      restart_policy:
        condition: on-failure
        max_attempts: 1
      placement:
        constraints: [node.role == manager]

  couchdb-bofasg2x:
    container_name: couchdb-bofasg2x
    image: couchdb:2.3.1
    ports:
      - 6984:5984
    environment:
      DB_URL: http://localhost:5984/member_db
    networks:
      fabric:
        aliases:
          - couchdb-bofasg2x
    deploy:
      mode: replicated
      restart_policy:
        condition: on-failure
